# Builds and tests show-me on Windows, Linux and macOS. On one version tag (v1.2.3) it
# also publishes those three tested binaries as one GitHub release.
# Zig comes straight from ziglang.org at one pinned version. No third-party actions.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig: zig-x86_64-linux
            archive: tar.xz
            target: x86_64-linux-musl
            out: show-me-linux-x86_64
          - os: macos-latest
            zig: zig-aarch64-macos
            archive: tar.xz
            target: aarch64-macos
            out: show-me-macos-arm64
          - os: windows-latest
            zig: zig-x86_64-windows
            archive: zip
            target: x86_64-windows
            out: show-me-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          name="${{ matrix.zig }}-$ZIG_VERSION"
          curl -fsSL -o zig.archive "https://ziglang.org/download/$ZIG_VERSION/$name.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then unzip -q zig.archive; else tar -xf zig.archive; fi
          echo "$PWD/$name" >> "$GITHUB_PATH"

      # Runs the installer the way `npx show-me-cli` does: install.js starts install.ps1 or
      # install.sh. It downloads the latest release, so this step tests the installer and
      # gives the later steps Graphviz.
      - name: Installer
        run: |
          node install.js
          "$HOME/.local/bin/show-me" --version
          if [ "$RUNNER_OS" != "Windows" ]; then dot -V; fi

      # The Windows installer adds its folder to the user PATH. Entries that hold one
      # variable, like %USERPROFILE%\go\bin, must keep it, and the value must stay expandable.
      - name: Installer keeps PATH variables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = "HKCU:\Environment"
          Set-ItemProperty -Path $key -Name Path -Value "%USERPROFILE%\showme-test-bin" -Type ExpandString
          $env:SHOW_ME_INSTALL_DIR = "$env:RUNNER_TEMP\showme-path-test"
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
          $raw = (Get-Item $key).GetValue("Path", "", "DoNotExpandEnvironmentNames")
          Write-Host "user PATH after install: $raw"
          if ($raw -notlike "*%USERPROFILE%\showme-test-bin*") { throw "the installer expanded one PATH variable" }
          if ($raw -notlike "*showme-path-test*") { throw "the installer did not add its folder" }
          if ((Get-Item $key).GetValueKind("Path") -ne "ExpandString") { throw "the PATH value is no longer expandable" }

      - name: Unit tests
        run: |
          for f in src/*.zig; do
            if grep -q '^test "' "$f"; then echo "== $f"; zig test "$f"; fi
          done

      - name: Build
        run: zig build-exe src/main.zig -O ReleaseSafe -target ${{ matrix.target }} -femit-bin=${{ matrix.out }}

      - name: Smoke test
        run: bash test/smoke.sh "./${{ matrix.out }}"

      # `show-me update` starts the installer and exits, so the installer can replace the
      # program file, also on Windows. Proof: the file changes within one minute.
      - name: Update replaces the program
        run: |
          d="$RUNNER_TEMP/update-test"; mkdir -p "$d/home"
          name=show-me; [ "$RUNNER_OS" = "Windows" ] && name=show-me.exe
          cp "./${{ matrix.out }}" "$d/$name"
          hash() { (sha256sum "$1" 2> /dev/null || shasum -a 256 "$1") | cut -c1-16; }
          before="$(hash "$d/$name")"
          SHOW_ME_KEEP_PATH=1 HOME="$d/home" USERPROFILE="$d/home" "$d/$name" update
          for _ in $(seq 60); do
            after="$(hash "$d/$name")"
            [ -n "$after" ] && [ "$after" != "$before" ] && break
            sleep 1
          done
          echo "before $before, after $after"
          test "$after" != "$before"
          "$d/$name" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
