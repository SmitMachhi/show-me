<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>show-me</title>
<link rel="stylesheet" href="/ui.css">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-checks" viewBox="0 0 24 24"><path d="M17 6 6 17l-4-4M22 10l-7.5 7.5L13 16"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m4 4 6.5 16 2.3-6.7L19.5 11z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="m8.2 8.2 7.6 7.6"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 14a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><path d="M12 3v3M6 10a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM10 13v1M14 13v1"/></symbol>
</svg>
<iframe id="page" title="Page under review" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
<aside>
    <header>
        <strong>show-me</strong>
        <span id="agent" class="presence" data-state="nobody" role="status"><i></i><span></span></span>
    </header>
    <ul id="list"></ul>
    <p id="empty"><svg class="icon"><use href="#i-pointer"/></svg>Click any part of the page to leave one note.</p>
    <p id="status" role="alert"></p>
    <form id="form" class="composer">
        <div id="target" class="chip" hidden>
            <svg class="icon"><use/></svg><span></span>
            <button type="button" id="clear" class="plain" aria-label="Clear the target"><svg class="icon"><use href="#i-x"/></svg></button>
        </div>
        <textarea id="note" rows="2" aria-label="Note" placeholder="Write one note"></textarea>
        <div class="bar">
            <small>Enter adds. Ctrl+Enter sends.</small>
            <button type="submit" class="ghost">Add</button>
            <button type="button" id="send" class="send" aria-label="Send notes">
                <b id="count"></b>
                <svg class="icon go"><use href="#i-send"/></svg>
                <svg class="icon done"><use href="#i-check"/></svg>
            </button>
        </div>
    </form>
</aside>
<script src="/ui.js"></script>
</html>
