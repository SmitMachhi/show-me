<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>show-me</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; height: 100vh; font: 14px/1.4 system-ui, sans-serif; }
    iframe { flex: 1; border: 0; min-width: 0; background: #fff; }
    aside { width: 340px; display: flex; flex-direction: column; border-left: 1px solid #8884; }
    #list { flex: 1; overflow: auto; margin: 0; padding: 8px 12px; list-style: none; }
    #list li { padding: 8px 0; border-bottom: 1px solid #8883; overflow-wrap: anywhere; }
    #list small { display: block; opacity: 0.7; }
    #list button { float: right; }
    form { padding: 12px; border-top: 1px solid #8884; }
    #target { margin: 0 0 6px; overflow-wrap: anywhere; }
    #target:empty { display: none; }
    textarea { width: 100%; font: inherit; resize: vertical; }
    #row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    #status { flex: 1; margin: 0; }
    @media (max-width: 760px) {
        body { flex-direction: column; }
        aside { width: auto; height: 45vh; border-left: 0; border-top: 1px solid #8884; }
    }
</style>
<iframe id="page" title="Page under review" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
<aside>
    <ul id="list"></ul>
    <form id="form">
        <p id="target"></p>
        <textarea id="note" rows="3" aria-label="Note" placeholder="Click part of the page, or type one message here"></textarea>
        <div id="row">
            <p id="status"></p>
            <button type="submit">Add</button>
            <button type="button" id="send">Send</button>
        </div>
    </form>
</aside>
<script>
const key = location.pathname.split("/").pop();
const page = document.getElementById("page");
const note = document.getElementById("note");
const store = "showme:" + key;
let queue = [];
let target = null;
try { queue = JSON.parse(sessionStorage.getItem(store)) || []; } catch (e) { queue = []; }

function label(n) {
    if (n.node) return "Graph: " + n.node;
    if (n.kind === "text") return "Text: “" + n.text.slice(0, 80) + "”";
    if (n.selector) return n.selector;
    return n.kind === "page" ? "From the page" : "Message";
}

function render() {
    try { sessionStorage.setItem(store, JSON.stringify(queue)); } catch (e) {}
    const list = document.getElementById("list");
    list.textContent = "";
    queue.forEach((n, i) => {
        const li = document.createElement("li");
        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.onclick = () => { queue.splice(i, 1); render(); };
        const where = document.createElement("small");
        where.textContent = label(n);
        li.append(remove, where, n.note);
        list.append(li);
    });
    document.getElementById("target").textContent = target ? "On: " + label(target) : "";
    document.getElementById("send").disabled = queue.length === 0;
}

function add() {
    const text = note.value.trim();
    if (!text) return false;
    queue.push(Object.assign({ kind: "message" }, target, { note: text }));
    note.value = "";
    target = null;
    render();
    return true;
}

async function send() {
    add();
    if (!queue.length) return;
    const status = document.getElementById("status");
    try {
        const r = await fetch("/send/" + key, { method: "POST", body: JSON.stringify(queue) });
        if (!r.ok) throw new Error(r.status);
        status.textContent = "Sent " + queue.length + ".";
        queue = [];
    } catch (e) {
        status.textContent = "Not sent. Run show-me open again, then press Send.";
    }
    render();
}

addEventListener("message", (e) => {
    const m = e.data;
    if (e.source !== page.contentWindow || !m || m.source !== "showme") return;
    if (m.type === "pick") {
        target = { kind: m.kind, selector: m.selector, text: m.text, node: m.node };
        note.focus();
    } else if (m.type === "note") {
        queue.push({ kind: "page", note: m.note, data: m.data });
    }
    render();
});

document.getElementById("form").onsubmit = (e) => { e.preventDefault(); add(); };
document.getElementById("send").onclick = send;
note.onkeydown = (e) => {
    if (e.key !== "Enter" || e.shiftKey) return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) send(); else add();
};
new EventSource("/events/" + key).onmessage = () => { page.src = "/a/" + key + "/?t=" + Date.now(); };
page.src = "/a/" + key + "/";
render();
</script>
</html>
