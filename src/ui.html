<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>show-me</title>
<link rel="stylesheet" href="/ui.css">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-checks" viewBox="0 0 24 24"><path d="M17 6 6 17l-4-4M22 10l-7.5 7.5L13 16"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m4 4 6.5 16 2.3-6.7L19.5 11z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="m8.2 8.2 7.6 7.6"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 14a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><path d="M12 3v3M6 10a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM10 13v1M14 13v1"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 5v.01M12 12v.01M12 19v.01"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 4v7h-7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m4 18 5-5 4 4 3-3 4 4"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M15 8l4 4-4 4M19 12H9"/></symbol>
</svg>
<header>
    <strong>show-me</strong>
    <span id="title"></span>
    <span id="agent" class="presence" data-state="nobody" role="status"><i></i><span></span></span>
    <button id="mode" class="switch" type="button" role="switch" aria-checked="true" title="Annotate (Ctrl+I)"><i></i>Annotate</button>
    <button id="toggle" class="tool" type="button" title="Hide chat" aria-label="Hide chat"><svg class="icon"><use href="#i-panel"/></svg><b id="badge"></b></button>
    <div class="menu">
        <button id="more" class="tool" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg class="icon"><use href="#i-more"/></svg></button>
        <div id="menu" role="menu" hidden>
            <button id="copy" type="button" role="menuitem"><svg class="icon"><use href="#i-copy"/></svg><span>Copy file path</span></button>
            <button id="reload" type="button" role="menuitem"><svg class="icon"><use href="#i-reload"/></svg><span>Reload</span></button>
            <button id="end" type="button" role="menuitem"><svg class="icon"><use href="#i-stop"/></svg><span>End review</span></button>
        </div>
    </div>
</header>
<main>
    <iframe id="page" title="Page" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
    <aside>
        <p id="banner" role="alert" hidden></p>
        <ul id="list"></ul>
        <p id="empty"><svg class="icon"><use href="#i-pointer"/></svg>Click anything on the page to comment.</p>
        <p id="over">Review ended</p>
        <form id="form" class="composer">
            <div id="thumbs" class="thumbs"></div>
            <div class="bar">
                <button type="button" id="attach" class="tool" title="Attach image" aria-label="Attach image"><svg class="icon"><use href="#i-image"/></svg></button>
                <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
                <textarea id="note" rows="1" aria-label="Message" placeholder="Message"></textarea>
                <button type="submit" id="send" class="send" title="Send" aria-label="Send">
                    <b id="count"></b>
                    <svg class="icon go"><use href="#i-send"/></svg>
                    <svg class="icon done"><use href="#i-check"/></svg>
                </button>
            </div>
        </form>
    </aside>
</main>
<script type="module" src="/ui.js"></script>
</html>
