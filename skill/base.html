<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TITLE</title>
<style>
    :root { --line: #8885; --soft: #8882; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; padding: 32px 24px 64px; max-width: 72rem; font: 16px/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 0.5em; }
    h2 { font-size: 1.25rem; margin: 2em 0 0.5em; }
    p, ul, ol { max-width: 44rem; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { text-align: left; vertical-align: top; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); }
    code, pre { font: 0.9em ui-monospace, Consolas, monospace; background: var(--soft); border-radius: 4px; }
    code { padding: 1px 4px; }
    pre { padding: 12px; overflow: auto; }
    pre code { padding: 0; background: none; }
    figure { margin: 1.5em 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; overflow: auto; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 16px; }
    .row > * { min-width: 0; }
    button, input, select, textarea { font: inherit; }
</style>
</head>
<body>
<h1>TITLE</h1>
<p>ANSWER FIRST.</p>
</body>
</html>
