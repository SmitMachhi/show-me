<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TITLE</title>
<style>
    :root {
        --bg: #fbfbfa; --card: #fff; --text: #1b1b1a; --muted: #6f6f6b; --accent: #3657d6;
        --line: rgb(0 0 0 / 0.1); --soft: rgb(0 0 0 / 0.045);
        --lift: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.04), 0 6px 16px rgb(0 0 0 / 0.04);
    }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #161616; --card: #1f1f1f; --text: #ededeb; --muted: #9b9b96; --accent: #8ea2ff;
            --line: rgb(255 255 255 / 0.12); --soft: rgb(255 255 255 / 0.07); }
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--text); }
    body { margin: 0 auto; padding: 48px 28px 96px; max-width: 72rem; font: 16px/1.55 system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 0.6em; text-wrap: balance; }
    h2 { font-size: 1.25rem; letter-spacing: -0.01em; margin: 2.4em 0 0.5em; text-wrap: balance; }
    p, ul, ol { max-width: 44rem; text-wrap: pretty; }
    a { color: var(--accent); text-underline-offset: 2px; }
    ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; font-variant-numeric: tabular-nums; }
    th { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    th, td { text-align: left; vertical-align: top; padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); }
    code, pre { font: 0.88em ui-monospace, Consolas, monospace; background: var(--soft); border-radius: 6px; }
    code { padding: 2px 5px; }
    pre { padding: 14px 16px; overflow: auto; }
    pre code { padding: 0; background: none; }
    /* Diagrams are drawn dark on white, so their card stays white in both themes. */
    figure { margin: 1.5em 0; padding: 16px; border-radius: 14px; background: #fff; box-shadow: var(--lift); overflow: auto; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 16px; }
    .row > * { min-width: 0; }
    button, input, select, textarea { font: inherit; }
</style>
</head>
<body>
<h1>TITLE</h1>
<p>ANSWER FIRST.</p>
</body>
</html>
